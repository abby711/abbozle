<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Abbozle</title>
  <meta name="description" content="Little apps I build so I don't have to pay for subscriptions.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%231a1a1b'/%3E%3Ctext x='32' y='45' font-family='Arial,sans-serif' font-size='38' font-weight='700' fill='white' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;700;800&family=Zilla+Slab:wght@700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #ffffff;
      --surface: #ffffff;
      --text: #1a1a1b;
      --muted: #6b6e70;
      --border: #d3d6da;
      --card-shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.06);
      --green: #6aaa64;
      --yellow: #c9b458;
      --gray: #787c7e;
      --font: 'Libre Franklin', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      --font-title: 'Zilla Slab', Georgia, serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121213;
        --surface: #1a1a1b;
        --text: #f8f8f8;
        --muted: #9a9c9e;
        --border: #3a3a3c;
        --card-shadow: 0 1px 2px rgba(0,0,0,.4);
        --green: #538d4e;
        --yellow: #b59f3b;
        --gray: #3a3a3c;
      }
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
    }

    .wrap {
      width: 100%;
      max-width: 880px;
      margin: 0 auto;
      padding-left: 16px;
      padding-right: 16px;
    }

    header { padding-top: 64px; padding-bottom: 40px; text-align: center; }

    .logo {
      display: inline-flex;
      gap: 6px;
      margin-bottom: 20px;
    }
    .logo span {
      width: 48px;
      height: 48px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 26px;
      font-weight: 800;
      text-transform: uppercase;
      animation: flip 600ms ease both;
    }
    .logo .g { background: var(--green); }
    .logo .y { background: var(--yellow); }
    .logo .x { background: var(--gray); }
    @keyframes flip {
      0% { transform: rotateX(-90deg); opacity: 0; }
      100% { transform: rotateX(0); opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) { .logo span { animation: none; } }

    h1 {
      margin: 0;
      font-family: var(--font-title);
      font-size: 44px;
      line-height: 1.05;
    }
    .tagline {
      margin: 12px auto 0;
      max-width: 460px;
      font-size: 17px;
      line-height: 1.5;
      color: var(--muted);
    }

    main { flex: 1; padding-bottom: 56px; }

    .section-label {
      margin: 0 0 14px;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 16px;
    }

    .card {
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 20px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
      box-shadow: var(--card-shadow);
      color: inherit;
      text-decoration: none;
      transition: transform 150ms ease, border-color 150ms ease;
    }
    a.card:hover { transform: translateY(-2px); border-color: var(--muted); }
    a.card:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }

    .card-top { display: flex; align-items: center; gap: 14px; }
    .card-icon {
      width: 52px;
      height: 52px;
      flex-shrink: 0;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      background: color-mix(in srgb, var(--text) 6%, transparent);
    }
    .mini-tiles {
      display: grid;
      grid-template-columns: repeat(3, 11px);
      gap: 3px;
    }
    .mini-tiles i { width: 11px; height: 11px; display: block; }
    .mini-tiles .g { background: var(--green); }
    .mini-tiles .y { background: var(--yellow); }
    .mini-tiles .x { background: var(--gray); }
    html .mini-tiles .x { background: #787c7e; }

    .card-name { margin: 0; font-size: 20px; font-weight: 800; }
    .card-tag {
      display: inline-block;
      margin-top: 4px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .04em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .card-desc { margin: 0; font-size: 15px; line-height: 1.5; color: var(--muted); flex: 1; }
    .card-cta { font-size: 15px; font-weight: 700; color: var(--green); }

    .card.soon {
      border-style: dashed;
      box-shadow: none;
      background: transparent;
      justify-content: center;
      align-items: center;
      text-align: center;
      min-height: 180px;
      color: var(--muted);
    }
    .card.soon .card-icon { background: none; border: 2px dashed var(--border); }

    footer {
      padding-top: 24px;
      padding-bottom: 32px;
      border-top: 1px solid var(--border);
      font-size: 14px;
      color: var(--muted);
      text-align: center;
    }
    footer a { color: inherit; }

    @media (max-width: 480px) {
      header { padding-top: 44px; padding-bottom: 28px; }
      .logo { gap: 4px; }
      .logo span { width: 38px; height: 38px; font-size: 21px; }
      h1 { font-size: 36px; }
    }
  </style>
</head>
<body>
  <header class="wrap">
    <div class="logo" aria-hidden="true" id="logo"></div>
    <h1>Abbozle</h1>
    <p class="tagline">Little apps I build so I don't have to pay for subscriptions.</p>
  </header>

  <main class="wrap">
    <p class="section-label">Apps</p>
    <div class="grid" id="apps"></div>
  </main>

  <footer class="wrap">
    Made by <a href="https://github.com/abby711">abby711</a> ·
    <a href="https://github.com/abby711/abbozle">Source on GitHub</a>
  </footer>

  <script>
    /*
     * ➕ To add a new app:
     *   1. Put it in its own folder in this repo, e.g. /notes/index.html
     *   2. Add an entry below. `icon` can be an emoji like '📝'.
     */
    var APPS = [
      {
        name: 'Words',
        path: 'words/',
        tag: 'Game',
        description: 'Unlimited five-letter word puzzles. Six tries, no daily limit, hard mode and stats included.',
        icon: '<div class="mini-tiles"><i class="x"></i><i class="y"></i><i class="x"></i><i class="g"></i><i class="g"></i><i class="g"></i></div>'
      }
    ];

    // Logo tiles: A B B O Z L E
    var colors = ['g', 'y', 'x', 'g', 'y', 'x', 'g'];
    var logo = document.getElementById('logo');
    'abbozle'.split('').forEach(function (ch, i) {
      var s = document.createElement('span');
      s.className = colors[i];
      s.textContent = ch;
      s.style.animationDelay = (i * 90) + 'ms';
      logo.appendChild(s);
    });

    var grid = document.getElementById('apps');
    APPS.forEach(function (app) {
      var a = document.createElement('a');
      a.className = 'card';
      a.href = app.path;
      a.innerHTML =
        '<div class="card-top">' +
          '<div class="card-icon">' + app.icon + '</div>' +
          '<div><h2 class="card-name"></h2><span class="card-tag"></span></div>' +
        '</div>' +
        '<p class="card-desc"></p>' +
        '<span class="card-cta">Open →</span>';
      a.querySelector('.card-name').textContent = app.name;
      a.querySelector('.card-tag').textContent = app.tag || '';
      a.querySelector('.card-desc').textContent = app.description;
      grid.appendChild(a);
    });

    var soon = document.createElement('div');
    soon.className = 'card soon';
    soon.innerHTML = '<div class="card-icon">＋</div><div>Next app coming soon</div>';
    grid.appendChild(soon);
  </script>
</body>
</html>
